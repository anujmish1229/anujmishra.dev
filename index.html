    <script>
    (function () {
        var cls = 'boot-skip';
        try {
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!reduced && !sessionStorage.getItem('bootPlayed')) {
                cls = 'boot-play';
                sessionStorage.setItem('bootPlayed', '1');
            }
        } catch (e) {}
        document.documentElement.className += ' ' + cls;
    })();
    </script>

<body>
    <noscript>
        <div class="noscript">This site renders Anuj's career as an interactive commit log and needs JavaScript. The facts: Math + Business @ University of Waterloo — <a href="mailto:a85mishr@uwaterloo.ca">a85mishr@uwaterloo.ca</a> · <a href="https://github.com/anujmish1229">github.com/anujmish1229</a> · <a href="https://www.linkedin.com/in/anujmish/">linkedin.com/in/anujmish</a> · <a href="resume.pdf">resume</a></div>
    </noscript>
    <div class="boot" id="boot" aria-hidden="true">
        <pre class="boot__line" style="--i:0">$ git clone https://github.com/anujmish1229/anujmishra.dev</pre>
        <pre class="boot__line boot__line--ok" style="--i:1">Cloning into 'anujmishra.dev'... done.</pre>
        <pre class="boot__line" style="--i:2">$ git push origin main</pre>
        <pre class="boot__line boot__line--ok" style="--i:3">main -> main (up to date)</pre>
        <pre class="boot__line" style="--i:4">$ open https://anujmishra.dev</pre>
        <pre class="boot__line boot__line--ok" style="--i:5">anujmishra.dev is live</pre>
    </div>

    <header class="bar">
        <a class="bar__identity" href="./" data-cmdk-checkout="home" aria-label="anujmishra.dev home">
            <img class="bar__logo" src="images/panda.png" alt="" width="20" height="20">
            <span class="bar__path">anujmishra.dev</span>
        </a>

        <nav class="tabs" aria-label="Sections">
            <button class="tabs__tab" type="button" data-ref="projects" aria-current="page">projects</button>
            <button class="tabs__tab" type="button" data-ref="experience">experience</button>
            <button class="tabs__tab" type="button" data-ref="about">about</button>
        </nav>

        <button class="bar__find" type="button" data-cmdk-open aria-haspopup="dialog" aria-label="Open command menu">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <kbd data-cmdk-key></kbd>
        </button>
    </header>

    <main class="log" id="log" aria-live="polite">
        <div class="log__rail" aria-hidden="true"></div>
        <ol class="log__list" id="log-list"></ol>
    </main>

    <dialog id="cmdk" class="cmdk" aria-label="Command menu">
        <div class="cmdk__bar">
            <span class="cmdk__prompt" aria-hidden="true">&gt;</span>
            <input id="cmdk-input" class="cmdk__input" type="text" placeholder="Jump to a section, open a link, copy email…"
                   autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true"
                   aria-controls="cmdk-list" aria-autocomplete="list">
        </div>
        <ul id="cmdk-list" class="cmdk__list" role="listbox"></ul>
        <p class="cmdk__empty" hidden>no matching commands</p>
        <div class="cmdk__foot">
            <span><kbd>&uarr;&darr;</kbd> navigate</span>
            <span><kbd>Enter</kbd> select</span>
            <span><kbd>Esc</kbd> close</span>
        </div>
        <p id="cmdk-status" class="sr-only" role="status" aria-live="polite"></p>
    </dialog>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cmdk.js"></script>
    <script src="js/cursor.js"></script>
</body>
</html>
